name: Build & Screenshot

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-screenshot:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build for iOS Simulator
        run: |
          xcodebuild \
            -project HI.xcodeproj \
            -scheme HI \
            -configuration Debug \
            -sdk iphonesimulator \
            -derivedDataPath build \
            build

      - name: Boot simulator, install app & capture screenshot
        run: |
          UDID=$(xcrun simctl list devices available | grep "iPhone" | head -1 | grep -oE '[0-9A-F]{8}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{12}')
          echo "Using simulator UDID: ${UDID}"
          xcrun simctl boot "${UDID}" || true
          xcrun simctl bootstatus "${UDID}"
          APP_PATH="build/Build/Products/Debug-iphonesimulator/HI.app"
          xcrun simctl install "${UDID}" "${APP_PATH}"
          xcrun simctl launch "${UDID}" com.hi.app
          sleep 8
          xcrun simctl io "${UDID}" screenshot screenshot-home.png

      - name: Upload screenshot
        uses: actions/upload-artifact@v4
        with:
          name: hi-screenshots
          path: screenshot-home.png
          if-no-files-found: error
